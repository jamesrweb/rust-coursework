version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "**/*"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "cargo"
      - "dependencies"
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "🧹 chore"
      include: "scope"
