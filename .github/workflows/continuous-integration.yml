name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check formatting
        run: find . -name Cargo.toml -not -path "*/target/*" -print0 | while IFS= read -r -d '' manifest; do (cd "$(dirname "$manifest")" && cargo fmt --check); done
        shell: bash

      - name: Lint
        run: find . -name Cargo.toml -not -path "*/target/*" -print0 | while IFS= read -r -d '' manifest; do (cd "$(dirname "$manifest")" && cargo clippy -- -D warnings); done
        shell: bash

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Test
        run: find . -name Cargo.toml -not -path "*/target/*" -print0 | while IFS= read -r -d '' manifest; do (cd "$(dirname "$manifest")" && cargo test); done
        shell: bash